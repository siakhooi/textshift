name: Deploy Open VSX

on:
  workflow_call:

jobs:
  deploy_open_vsx:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Publish to Open VSX
        run: npx --yes ovsx@1.3 publish --trusted-publishing "$(ls *.vsix)"
