version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    assignees:
      - 'siakhooi'
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    assignees:
      - 'siakhooi'
    ignore:
      - depenency-name: "@types/vscode"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

